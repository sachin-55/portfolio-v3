name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Add safe directory
        run: git config --global --add safe.directory /home/nihcas/server/portfolio-v3

      - name: Update code on server
        run: |
          cd /home/nihcas/server/portfolio-v3
          git fetch origin main
          git reset --hard origin/main
          git clean -fd

      - name: Install dependencies
        run: |
          cd /home/nihcas/server/portfolio-v3
          pnpm install

      - name: Build
        run: |
          cd /home/nihcas/server/portfolio-v3
          pnpm run build

      - name: Restart PM2
        run: |
          pm2 reload portfolio-v3
